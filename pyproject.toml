[project]
name = "test-crypto"
version = "0.2.0"
description = "Deribit index price collector + FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery>=5.4",
    "fastapi>=0.115",
    "psycopg2-binary>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
deploy = [
    "supervisor>=4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
