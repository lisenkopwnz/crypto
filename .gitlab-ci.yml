test:
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: crypto
    POSTGRES_PASSWORD: crypto
    POSTGRES_DB: crypto_test
    POSTGRES_HOST: postgres
    TEST_DATABASE_URL: postgresql+asyncpg://crypto:crypto@postgres:5432/crypto_test
  before_script:
    - pip install uv==0.10.5
    - uv sync --frozen
  script:
    - uv run ruff check .
    - uv run alembic upgrade head
    - uv run alembic check
    - uv run pytest -v
