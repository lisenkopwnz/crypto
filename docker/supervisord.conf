[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker]
command=celery -A app.worker.main:celery_app worker --loglevel=INFO --concurrency=2
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=30

[program:beat]
command=celery -A app.worker.main:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
