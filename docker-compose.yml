services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://itds_user:itds_password@db:5432/itds_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - celery-worker

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: itds_user
      POSTGRES_PASSWORD: itds_password
      POSTGRES_DB: itds_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  celery-worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./app:/app/app  # Монтируем только папку с кодом
    environment:
      DATABASE_URL: postgresql://itds_user:itds_password@db:5432/itds_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  celery-beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./app:/app/app  # Монтируем только папку с кодом
    environment:
      DATABASE_URL: postgresql://itds_user:itds_password@db:5432/itds_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - celery-worker
    restart: always

volumes:
  pgdata: